<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Adil — ECE, Embedded Systems and IoT</title>
  <desc id="desc">A polished dark green electronics-inspired banner with circuit traces, a microcontroller motif, and the name Mohammed Adil.</desc>
  <defs>
